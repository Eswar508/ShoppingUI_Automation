services:
  ui-tests:
    build:
      context: .
    # Keep the host-mounted report folder writable on Windows and Linux.
    user: "0:0"
    environment:
      BASE_URL: ${BASE_URL:-https://sauce-demo.myshopify.com/}
      CHROME_BIN: /usr/bin/chromium
      HEADLESS: "true"
    shm_size: "2gb"
    volumes:
      - ./reports:/app/reports
    command:
      - pytest
      - -v
      - --alluredir=reports/allure-results
      - --clean-alluredir
      - --html=reports/pytest-report.html
      - --self-contained-html
